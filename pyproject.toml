[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]  # setuptools>=61 minimum, >=80 recommended
build-backend = "setuptools.build_meta"

[project]
name = "setuptools-scm-distance"
dynamic = [
  "version",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["setuptools-scm"]

[project.entry-points.'setuptools_scm.version_scheme']
tag-plus-distance = 'setuptools_scm_distance:get_tag_distance'

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"